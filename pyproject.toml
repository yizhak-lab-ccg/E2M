[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "e2m"
version = "0.2.0"
description = "Predict somatic mutation status from RNA expression."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Asaf Pinhasi"},
    {name = "Keren Yizhak"},
]
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "xgboost>=2.0",
]

[project.optional-dependencies]
interpretation = [
    "shap>=0.45",
]
lightgbm = [
    "lightgbm>=4.0",
]
test = [
    "pytest>=8",
]

[project.scripts]
e2m = "e2m.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
e2m = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
